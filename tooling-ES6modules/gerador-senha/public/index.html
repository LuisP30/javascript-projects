<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Gerador de senha</title>
</head>

<body>

  <section class="container">
    <h1>Gerador de senha</h1>
    <div class="senha-gerada">Selecione as opções</div>
    <p>Quantidade de caracteres <input type="number" class="qtd-caracteres" value="6" min="1" max="50"></p>
    <p>Adicionar números <input type="checkbox" class="chk-numeros" checked></p>
    <p>Letras maiúsculas <input type="checkbox" class="chk-minusculas"></p>
    <p>Letras minúsculas <input type="checkbox" class="chk-maiusculas"></p>
    <p>Símbolos <input type="checkbox" class="chk-simbolos"></p>
    <button class="gerar-senha">Gerar senha</button>
  </section>

  <script src="./assets/js/bundle.js"></script>
</body>

</html>
